name: Codeforces to GitHub Sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Sync solved problems from Codeforces
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_HANDLE: ${{ secrets.CF_HANDLE || 'Shadoo25' }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python sync_cf_to_github.py \
            --handle "$CF_HANDLE" \
            --repo "$GITHUB_REPO" \
            --branch main
